spring:
  application:
    name: travel-agent

  # E1：Redis 集中存储（对话记忆+行程状态）。超时 2s 保证 Redis 故障时快速降级而不是干等
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s
      connect-timeout: 2s

  ai:
    model:
      chat: openai           # 对话：OpenAI 兼容协议 → DeepSeek
      embedding: ollama      # 向量：本地 Ollama（M3 RAG 时才真正调用，不跑 Ollama 不影响启动）

    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}   # 只从环境变量读，千万别写死提交！
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7   # 攻略生成要一点发散性，0.7 合适

    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: bge-m3      # Day4 实测：中文召回精准

server:
  port: 8081 # 8080 留给 spring-ai-hello，两个项目可同时跑

# E3 可观测性：暴露 metrics（含 Spring AI 原生 chat observation + 自定义成本打点）
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: travel-agent

# E3 成本估算单价（¥/百万 token，deepseek-chat 官方价目表调整时只改这里）
travel:
  cost:
    input-per-million: 2.0
    output-per-million: 8.0
